{% extends "base.html" %}{% block body %}
<div class="row justify-content-center"><div class="col-md-5"><div class="card shadow-sm"><div class="card-body">
<h4>Sign in</h4>
{% if not configured %}<div class="alert alert-warning">No password is configured. Set <code>DASHBOARD_PASSWORD</code> in <code>.env</code> and restart <code>niftybot-web</code>.</div>{% endif %}
<form method="post"><input class="form-control mb-3" type="password" name="password" placeholder="Dashboard password" autofocus required>
<button class="btn btn-primary w-100">Sign in</button></form></div></div></div></div>{% endblock %}
